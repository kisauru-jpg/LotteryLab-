name: Atualizar Loterias
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *'
concurrency:
  group: atualizar-loterias
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .【entity-github¦canonical_name=GitHub】/scripts/atualizar.mjs
      - run: |
          git config user.name "lotterylab-bot"
          git config user.email "bot@lotterylab.local"
          git pull --rebase || true
          git add resultados.json
          git diff --cached --quiet || git commit -m "Atualizar resultados"
          git push
