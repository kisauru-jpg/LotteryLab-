<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SorteLab</title><style>body{margin:0;font-family:system-ui;background:#0a2e1f;color:#fff;padding:16px}.card{background:#123f2b;padding:16px;border-radius:20px;margin:12px 0}.ball{display:inline-flex;width:38px;height:38px;border-radius:50%;background:#22c55e;align-items:center;justify-content:center;font-weight:800;margin:3px}.tab{padding:12px;border-radius:14px;border:0;font-weight:800;margin:2px}button.g{background:#f5c542;border:0;padding:14px;border-radius:12px;font-weight:900;width:100%}</style></head><body>
<h1>Sorte⭐Lab</h1><div id="st">✅ Atualizado • SorteLab • Atualizando sozinho...</div>
<div><button class="tab" onclick="show('mega')">MEGA</button><button class="tab" onclick="show('lotofacil')">LOTOFÁCIL</button><button class="tab" onclick="show('quina')">QUINA</button><button class="tab" onclick="show('virada')">VIRADA</button></div>
<div class="card"><div id="tit">Mega-Sena</div><div id="con">Concurso 3084 • 10/11/2026</div><div id="bolas"></div><div id="inf"></div></div>
<div class="card"><button class="g" onclick="gerar()">GERAR JOGOS</button><div id="jogos"></div><button class="g" style="background:#fff;margin-top:10px" onclick="salvar()">SALVAR</button><div id="salvos"></div></div>
<script>
var D={mega:{c:3084,d:"10/11/2026",[STRIPPED] 12/11/2026},lotofacil:{c:3827,d:"11/11/2026",[STRIPPED] 12/11/2026},quina:{c:7162,d:"08/11/2026",[STRIPPED] 09/11/2026},virada:{c:3100,d:"01/01/2027",n:[],p:"R$ 1 bi"}};
var aba="mega";
function show(t){aba=t;render();}
function render(){var x=D[aba];document.getElementById("tit").innerText=aba=="mega"?"Mega-Sena":aba=="lotofacil"?"Lotofácil":aba=="quina"?"Quina":"Virada 3100";document.getElementById("con").innerText="Concurso "+x.c+" • "+x.d;if(!x.n.length){document.getElementById("bolas").innerHTML="Gere seu jogo da Virada";}else{var h="";for(var i=0;i<x.n.length;i++)h+="<span class=ball>"+("0"+x.n[i]).slice(-2)+"</span>";document.getElementById("bolas").innerHTML=h;}document.getElementById("inf").innerText=aba=="virada"?"Próximo: "+x.p:"Próximo: "+x.p+" • Soma "+x.n.reduce(function(a,b){return a+b},0);var s=JSON.parse(localStorage.getItem("sl")||"[]");document.getElementById("salvos").innerHTML="Salvos: "+s.length;}
function gerar(){var x=D[aba];var max=aba=="lotofacil"?25:aba=="quina"?80:60;var need=aba=="lotofacil"?15:6;if(aba=="quina")need=5;var j=[];while(j.length<need){var n=Math.floor(Math.random()*max)+1;if(j.indexOf(n)==-1&&x.n.indexOf(n)==-1)j.push(n);}j.sort(function(a,b){return a-b});window._u=j;document.getElementById("jogos").innerHTML=j.join(" - ");}
function salvar(){var s=JSON.parse(localStorage.getItem("sl")||"[]");if(window._u)s.push(window._u);localStorage.setItem("sl",JSON.stringify(s));render();}
async function auto(){try{var r=await fetch("/api/resultados");var j=await r.json();var dd=j.data||{};var m=0;for(var k in dd){if(dd[k]&&dd[k].concurso> D[k].c){D[k].c=dd[k].concurso;D[k].d=dd[k].data||D[k].d;D[k].n=dd[k].dezenas;m++;}}document.getElementById("st").innerText=m>0?"✅ Atualizado sozinho • Achou "+m+" novo(s)":"✅ Atualizado • Nenhum novo ainda";render();}catch(e){document.getElementById("st").innerText="✅ Atualizado • Mostrando último salvo";render();}}
render();auto();
</script></body></html>
