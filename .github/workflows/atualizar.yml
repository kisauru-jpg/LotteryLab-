name: Atualizar Loterias
"on":
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/atualizar.mjs
      - run: |
          git config user.name "lotterylab-bot"
          git config user.email "bot@lotterylab.local"
          git add resultados.json
          git diff --cached --quiet || git commit -m "Atualizar resultados"
          git push
