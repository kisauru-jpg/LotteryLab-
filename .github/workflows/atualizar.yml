name: Atualizar Loterias

"on":
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *'
    - cron: '0 5 * * *'

concurrency:
  group: atualizar-loterias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/atualizar.mjs
      - run: |
          git config user.name "lotterylab-bot"
          git config user.email "bot@lotterylab.local"
          git pull --rebase || true
          git add resultados.json || true
          git diff --cached --quiet || git commit -m "Atualizar resultados"
          git push || true
