<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SorteLab</title>
<style>body{margin:0;font-family:system-ui;background:#0a2e1f;color:#fff}header{padding:16px}.card{background:#123f2b;margin:12px;padding:16px;border-radius:20px}.tabs{display:flex;gap:8px;padding:0 12px}.tab{flex:1;padding:12px;border-radius:16px;border:0;font-weight:800}.tab.on{background:#fff;color:#0a2e1f}.tab.v{background:#5a4300;color:#ffd700}.ball{display:inline-flex;width:40px;height:40px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;margin:3px;background:#22c55e}.loto{background:#9333ea}.quina{background:#2563eb}.vir{background:#f59e0b;color:#000}button.g{background:#f5c542;border:0;padding:14px;border-radius:12px;font-weight:900;width:100%}.small{font-size:13px;opacity:.85}select{width:100%;padding:10px;border-radius:10px;border:0;margin:6px 0}</style></head>
<body><header><div style="font-size:28px;font-weight:900">Sorte⭐Lab</div><div class="small" id="status">✅ Atualizado • SorteLab • Atualizando sozinho...</div></header>
<div class="tabs"><button class="tab on" id="t-mega" onclick="muda('mega')">MEGA</button><button class="tab" id="t-lotofacil" onclick="muda('lotofacil')">LOTOFÁCIL</button><button class="tab" id="t-quina" onclick="muda('quina')">QUINA</button><button class="tab v" id="t-virada" onclick="muda('virada')">VIRADA</button></div>
<div class="card"><div id="titulo" style="font-size:22px;font-weight:900">Mega-Sena</div><div class="small" id="ultimo"></div><div id="bolas" style="margin:12px 0"></div><div class="small" id="info"></div><div class="small" id="hist"></div></div>
<div class="card"><div style="font-weight:900">✨ Gerador</div><select id="qtd"><option>1</option><option selected>3</option><option>5</option><option>10</option></select><button class="g" onclick="gerar()">GERAR JOGOS</button><div id="jogos"></div><button class="g" style="background:#fff;margin-top:10px" onclick="salvar()">💾 SALVAR JOGOS</button><div class="small" id="salvos"></div></div>
<div class="card"><div style="font-weight:900">📋 Conferência</div><button class="g" onclick="conferir()">CONFERIR SALVOS</button><div id="conf"></div></div>
<script>
var D={
mega:{c:3084,data:"10/11/2026",[STRIPPED] • 12/11/2026 • R$ 20.000.000",hist:"Conc. 3084 • 10/11/2026 • 6-14-22-30-31-37 (Soma 140)"},
lotofacil:{c:3827,data:"11/11/2026",[STRIPPED] • 12/11/2026 • R$ 5.000.000",hist:"Conc. 3827 • 11/11/2026 • 1-2-4-5-6-10-11-13-15-16-18-20-21-22-23 (Soma 187)"},
quina:{c:7162,data:"08/11/2026",[STRIPPED] • 09/11/2026 • R$ 2.100.000",hist:"Conc. 7162 • 08/11/2026 • 9-29-46-57-66"},
virada:{c:3100,data:"01/01/2027 11h",n:[],prox:"3100 • R$ 1.000.000.000 • Não acumula",hist:"Conc. 3099 • 01/01/2026 • 1-5-10-22-33-47"}
};
var aba="mega";
function soma(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s;}
function muda(t){aba=t;var b=document.querySelectorAll(".tab");for(var i=0;i<b.length;i++)b[i].classList.remove("on");document.getElementById("t-"+t).classList.add("on");render();}
function render(){var d=D[aba];document.getElementById("titulo").innerText=aba=="mega"?"Mega-Sena":aba=="lotofacil"?"Lotofácil":aba=="quina"?"Quina":"Mega da Virada • 3100";document.getElementById("ultimo").innerText=aba=="virada"?"Concurso 3100 • 01/01/2027 11h • R$ 1 bi • Não acumula":"Concurso "+d.c+" • "+d.data;if(aba=="virada"){document.getElementById("bolas").innerHTML="<div class=small>Gere seu jogo da Virada abaixo.</div>";}else{var h="";for(var i=0;i<d.n.length;i++){var cls=aba=="lotofacil"?"ball loto":aba=="quina"?"ball quina":"ball";h+="<span class='"+cls+"'>"+("0"+d.n[i]).slice(-2)+"</span>";}document.getElementById("bolas").innerHTML=h;}document.getElementById("info").innerText=aba=="virada"?"Próximo: "+d.prox:"Soma: "+soma(d.n)+" • Próximo: "+d.prox;document.getElementById("hist").innerHTML="<b>Histórico:</b><br>"+d.hist;var sv=JSON.parse(localStorage.getItem("sl_salvos")||"[]");var txt="";for(var i=0;i<sv.length;i++)txt+=(i+1)+". "+sv[i].join(" - ")+"<br>";document.getElementById("salvos").innerHTML="<b>Salvos:</b><br>"+(txt||"Nenhum salvo ainda.");}
function gerar(){var d=D[aba];var ult=d.n;var max=aba=="lotofacil"?25:aba=="quina"?80:60;var need=aba=="lotofacil"?15:aba=="mega"||aba=="virada"?6:5;var out=[];for(var k=0;k<parseInt(document.getElementById("qtd").value);k++){var jogo=[];if(aba=="lotofacil"){var novos=[];for(var n=1;n<=25;n++){if(ult.indexOf(n)==-1)novos.push(n);}novos.sort(function(){return Math.random()-0.5;});for(var x=0;x<5;x++)jogo.push(novos[x]);}var t=0;while(jogo.length<need&&t<2000){t++;var nn=Math.floor(Math.random()*max)+1;if(jogo.indexOf(nn)>-1)continue;if(aba!="lotofacil"&&ult.indexOf(nn)>-1)continue;var rep=false;for(var y=0;y<jogo.length;y++){if(Math.abs(jogo[y]-nn)==1)rep=true;}if(rep)continue;jogo.push(nn);}jogo.sort(function(a,b){return a-b;});if(jogo.length==need)out.push(jogo);}window._u=out;var html="";for(var i=0;i<out.length;i++){html+="<div style='margin:8px 0;padding:10px;background:#0a2e1f;border-radius:12px'>"+(i+1)+". ";for(var j=0;j<out[i].length;j++){var cls=aba=="lotofacil"?"ball loto":aba=="quina"?"ball quina":aba=="virada"?"ball vir":"ball";html+="<span class='"+cls+"'>"+("0"+out[i][j]).slice(-2)+"</span>";}html+="</div>";}document.getElementById("jogos").innerHTML=html;}
function salvar(){if(!window._u)return alert("Gere primeiro");var s=JSON.parse(localStorage.getItem("sl_salvos")||"[]");for(var i=0;i<window._u.length;i++)s.push(window._u[i]);localStorage.setItem("sl_salvos",JSON.stringify(s));render();alert("Salvo!");}
function conferir(){var s=JSON.parse(localStorage.getItem("sl_salvos")||"[]");var d=D[aba];if(!d.n.length){document.getElementById("conf").innerText="Virada sem resultado ainda - 01/01/2027";return;}var html="";for(var i=0;i<s.length;i++){var ac=0;for(var j=0;j<s[i].length;j++){if(d.n.indexOf(s[i][j])>-1)ac++;}html+=(i+1)+". "+s[i].join(" - ")+" → "+ac+" acertos<br>";}document.getElementById("conf").innerHTML=html||"Nenhum salvo.";}
function fmt(dt){if(!dt)return "";dt=String(dt);if(dt.indexOf("-")>-1){var p=dt.split("T")[0].split("-");if(p[0].length==4)return p[2]+"/"+p[1]+"/"+p[0];}return dt;}
async function auto(){try{var r=await fetch("/api/resultados");if(!r.ok) throw 0;var j=await r.json();var dd=j.data||{};var mudou=0;for(var k in dd){var v=dd[k];if(v&&v.concurso&&v.dezenas&&v.concurso>D[k].c){D[k].c=v.concurso;D[k].data=fmt(v.data)||D[k].data;D[k].n=v.dezenas;D[k].hist="Conc. "+v.concurso+" • "+D[k].data+" • "+v.dezenas.join("-")+" (Soma "+soma(v.dezenas)+")";mudou++;}}if(mudou>0) document.getElementById("status").innerText="✅ Atualizado sozinho • SorteLab • "+mudou+" novo(s) • "+new Date().toLocaleTimeString("pt-BR"); else document.getElementById("status").innerText="✅ Atualizado • SorteLab • Nenhum novo ainda • "+new Date().toLocaleTimeString("pt-BR");render();}catch(e){document.getElementById("status").innerText="✅ Atualizado • SorteLab • Mostrando último salvo";render();}}
render();auto();
</script></body></html>
